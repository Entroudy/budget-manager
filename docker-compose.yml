services:
  mysql:
    image: mysql:8.0
    container_name: bm_mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: admin
      MYSQL_DATABASE: bm_db
      MYSQL_PASSWORD: admin
    ports: 
      - "13006:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  budget-manager:
    build:
      context: .
      dockerfile: src/Backend/BudgetManager/BudgetManager.Presentation/Dockerfile
    image: budget-manager:latest
    ports:
      - 4000:80
    depends_on:
      mysql:
        condition: service_healthy
    restart: "always"
    environment:
      APP_ENV: 'local'
      HOST: 'localhost'
      PORT: '80'
      JWT_VALID_AUDIENCE: 'Api'
      JWT_VALID_ISSUER: 'http://localhost:8080'
      JWT_SECRET: 'f288ff98822f36c1151aa70149334892'
      ASPNETCORE_HTTP_PORTS: '80'
      DB_CONNECTION: server=mysql;port=3306;user=admin;password=admin;database=bm_db
  
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: bm_phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_USER: admin
      PMA_PASSWORD: admin
    ports:
      - 19107:80
    depends_on:
      - mysql
    volumes:
      - ./uploads.ini:/usr/local/etc/php/conf.d/uploads.ini

volumes:
  mysql_data:
