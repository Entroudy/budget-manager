name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - deploy-preparation
  workflow_dispatch:

concurrency:
  group: budget-manager-production
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: entroudy
  BACKEND_IMAGE: budget-manager-backend
  FRONTEND_IMAGE: budget-manager-frontend
  DOTNET_VERSION: 10.0.x
  NODE_VERSION: 20

jobs:
  validate:
    name: Validate code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore backend
        run: dotnet restore src/Backend/BudgetManager/BudgetManager.sln

      - name: Build backend
        run: dotnet build src/Backend/BudgetManager/BudgetManager.sln --configuration Release --no-restore

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/Frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/Frontend
        run: npm ci

      - name: Build frontend
        working-directory: src/Frontend
        env:
          NUXT_API_URL: /api
          NUXT_AUTH0_DOMAIN: example.auth0.com
          NUXT_AUTH0_CLIENT_ID: example-client-id
          NUXT_AUTH0_AUDIENCE: https://budget-manager.hu
        run: npm run generate

  build-and-push:
    name: Build and push images
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Backend/BudgetManager/BudgetManager.Presentation/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.BACKEND_IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Frontend/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            NUXT_API_URL=/api
            NUXT_AUTH0_DOMAIN=${{ secrets.NUXT_AUTH0_DOMAIN }}
            NUXT_AUTH0_CLIENT_ID=${{ secrets.NUXT_AUTH0_CLIENT_ID }}
            NUXT_AUTH0_AUDIENCE=${{ secrets.NUXT_AUTH0_AUDIENCE }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.sha }}

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push'

    steps:
      - name: Ensure remote directory exists
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script_stop: true
          script: mkdir -p /opt/budget-manager

      - name: Upload production compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          source: docker-compose.prod.yml
          target: /opt/budget-manager/

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            cd /opt/budget-manager
            cat > .env <<'EOF'
            MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
            MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}
            MYSQL_USER=${{ secrets.MYSQL_USER }}
            MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}

            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_VALID_AUDIENCE=${{ secrets.JWT_VALID_AUDIENCE }}
            JWT_VALID_ISSUER=${{ secrets.JWT_VALID_ISSUER }}

            DEFAULT_ADMIN_EMAIL=${{ secrets.DEFAULT_ADMIN_EMAIL }}
            DEFAULT_ADMIN_PASSWORD=${{ secrets.DEFAULT_ADMIN_PASSWORD }}
            EOF

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ${{ env.REGISTRY }} -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            docker compose -f docker-compose.prod.yml --env-file .env pull
            docker compose -f docker-compose.prod.yml --env-file .env up -d --remove-orphans
